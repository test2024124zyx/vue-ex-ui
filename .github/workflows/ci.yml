name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 固定 v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 固定 v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 校验发布规则
        run: npm run test:release

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Verify tree shaking
        run: npm run verify:tree-shaking

      - name: Build (library)
        run: npm run build

      - name: Verify published package
        run: npm run verify:package

      - name: Build (docs)
        run: npm run docs:build

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser acceptance
        run: npm run test:browser

      - name: Audit dependencies
        run: npm run audit:production
